name: macOS Sentinel CI

on:
  push:
    branches:
      - master
      - 'sentinel-*'
    paths:
      - 'src/libsync/killswitch/**'
      - 'src/gui/killswitch/**'
      - 'test/testkillswitch.cpp'
      - 'test/CMakeLists.txt'
      - '.github/workflows/macos-sentinel-ci.yml'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/libsync/killswitch/**'
      - 'src/gui/killswitch/**'
      - 'test/testkillswitch.cpp'
      - 'test/CMakeLists.txt'
      - '.github/workflows/macos-sentinel-ci.yml'
  workflow_dispatch:
    inputs:
      run_all_tests:
        description: 'Run all tests (not just Kill Switch)'
        required: false
        default: false
        type: boolean
      package:
        description: 'Build an installable macOS package (.dmg/.pkg)'
        required: false
        default: true
        type: boolean

concurrency:
  group: macos-sentinel-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

env:
  CRAFT_TARGET: macos-clang-arm64
  CRAFT_MASTER_LOCATION: ${{ github.workspace }}/CraftMaster
  CRAFT_MASTER_CONFIG: ${{ github.workspace }}/craftmaster.ini
  PYTHON_VERSION: '3.12'

jobs:
  build-and-test:
    name: Build & Test Kill Switch (Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 180

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Select Xcode 16.3
        run: sudo xcode-select -s /Applications/Xcode_16.3.app/Contents/Developer

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Homebrew dependencies
        run: brew install homebrew/cask/inkscape

      - name: Cache Craft dependencies
        id: cache-craft
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ github.workspace }}/craft-clone
            ${{ github.workspace }}/${{ env.CRAFT_TARGET }}
          key: craft-macos-sentinel-${{ hashFiles('craftmaster.ini') }}
          restore-keys: |
            craft-macos-sentinel-

      - name: Install Craft and Nextcloud Client dependencies
        if: steps.cache-craft.outputs.cache-hit != 'true'
        run: |
          set -e
          [ -d "$CRAFT_MASTER_LOCATION" ] || git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git "$CRAFT_MASTER_LOCATION"
          craft() { python "$CRAFT_MASTER_LOCATION/CraftMaster.py" --config "$CRAFT_MASTER_CONFIG" --target "$CRAFT_TARGET" -c "$@"; }

          echo "::group::Add blueprint repositories"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|next|"
          craft --add-blueprint-repository "https://github.com/nextcloud/desktop-client-blueprints.git|next|"
          echo "::endgroup::"

          echo "::group::Install Craft"
          craft craft
          echo "::endgroup::"

          echo "::group::Install dependencies"
          craft --install-deps nextcloud-client
          echo "::endgroup::"

      - name: Build Nextcloud Sentinel
        run: |
          set -e
          craft() { python "$CRAFT_MASTER_LOCATION/CraftMaster.py" --config "$CRAFT_MASTER_CONFIG" --target "$CRAFT_TARGET" -c "$@"; }

          echo "::group::Compile Nextcloud Sentinel"
          craft --options nextcloud-client.srcDir="${{ github.workspace }}" \
                --options nextcloud-client.buildFileProviderModule=False \
                nextcloud-client
          echo "::endgroup::"

      - name: Run Kill Switch tests
        run: |
          cd "${{ github.workspace }}/${{ env.CRAFT_TARGET }}/build/nextcloud-client/work/build"
          echo "::group::Run Kill Switch Tests"
          ctest -R KillSwitch --output-on-failure --timeout 300
          echo "::endgroup::"

      # NOTE: Upstream Nextcloud tests are run for visibility only.
      # They have known flaky tests unrelated to Kill Switch.
      # Only Kill Switch tests are required to pass.
      - name: Run all tests (informational)
        continue-on-error: true
        if: ${{ github.event.inputs.run_all_tests == 'true' || github.event_name == 'push' }}
        run: |
          cd "${{ github.workspace }}/${{ env.CRAFT_TARGET }}/build/nextcloud-client/work/build"
          echo "::group::Run All Tests"
          ctest --output-on-failure --timeout 300
          echo "::endgroup::"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-macos
          path: ${{ github.workspace }}/${{ env.CRAFT_TARGET }}/build/nextcloud-client/work/build/Testing/
          retention-days: 7

      # The package is not signed or notarized: macOS Gatekeeper will warn on first launch.
      - name: Package Nextcloud Sentinel
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.package == 'true' }}
        run: |
          set -e
          craft() { python "$CRAFT_MASTER_LOCATION/CraftMaster.py" --config "$CRAFT_MASTER_CONFIG" --target "$CRAFT_TARGET" -c "$@"; }

          echo "::group::Package Nextcloud Sentinel"
          craft --options nextcloud-client.srcDir="${{ github.workspace }}" \
                --options nextcloud-client.buildFileProviderModule=False \
                --package nextcloud-client
          echo "::endgroup::"

          mkdir -p "${{ github.workspace }}/macos-package"
          find "${{ github.workspace }}/${{ env.CRAFT_TARGET }}/tmp" -maxdepth 1 \( -name '*.dmg' -o -name '*.pkg' \) \
            -exec cp {} "${{ github.workspace }}/macos-package/" \;
          ls -la "${{ github.workspace }}/macos-package"

      - name: Upload macOS package
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.package == 'true' }}
        uses: actions/upload-artifact@v6
        with:
          name: nextcloud-sentinel-macos-arm64
          path: ${{ github.workspace }}/macos-package/
          if-no-files-found: error
          retention-days: 14
